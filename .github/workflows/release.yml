name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# npm requires interactive 2FA for publishes, so releases are published
# manually (npm login && npm publish --access public), not from CI.
# NPM_TOKEN is a stage-only token for user b7r_dev; it expires
# ~2026-12-16 and is not usable for publishing.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep (required by search_context tests)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: npm run smoke

      - name: Check npm release status
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@b7r_dev/groundcrew@$VERSION" version >/dev/null 2>&1; then
            echo "@b7r_dev/groundcrew@$VERSION is published on npm."
          else
            echo "::notice::@b7r_dev/groundcrew@$VERSION is not on npm yet. Publish manually (requires 2FA): npm login && npm publish --access public"
          fi
